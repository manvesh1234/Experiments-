
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List</title>

    <link rel="stylesheet" href="./todo.css">
</head>

<body>

    <div class="container">

        <div class="todo-card">

            <h1>My Todo List</h1>

            <p class="subtitle">
                Manage your daily tasks
            </p>

            <div class="input-box">
                <input
                    type="text"
                    id="todo-input"
                    placeholder="Write your task..."
                >

                <button type="button" id="add-btn">
                    Add
                </button>
            </div>

            <h3>My Tasks</h3>

            <ul id="todo-list">
                <!-- JavaScript tasks will appear here -->
            </ul>

        </div>

    </div>

    <script src="todo.js"></script>
</body>
</html>
